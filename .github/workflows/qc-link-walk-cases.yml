name: qc-link-walk-cases
# Gate-8 walk fixture for QC-Link feature 112 (T6.5 stand-in). Plain bash/curl/openssl/jq, no custom actions.
# Contract (QC-Link backend):
#   inputs   case_ids (comma list), environment (optional), qc_link_run_token  (buildDispatchInputs)
#   POST     $QC_LINK_RESULTS_URL  (repo variable; e.g. https://<host>/api/automation/results)
#   headers  x-qc-link-run-token: <token>   x-qc-link-signature: sha256=<hex HMAC-SHA256 over canonical JSON>
#   canonical JSON = keys sorted, no whitespace (jq -S -c); secret = repo secret QC_LINK_SIGNING_SECRET
#   body     {runId:"<github run id>", repository, runUrl, results:[{caseId,outcome,durationMs,errorDetail}]}
# Walk knobs (repo variables, all optional): QC_LINK_WALK_FAIL_IDS, QC_LINK_WALK_EXTRA_IDS, QC_LINK_WALK_PROBES=1
on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: comma separated case ids
        required: true
      environment:
        description: target environment
        required: false
      qc_link_run_token:
        description: single-use QC-Link run token
        required: true
jobs:
  post-results:
    runs-on: ubuntu-latest
    steps:
      - name: Post signed results to QC-Link
        env:
          CASE_IDS: ${{ inputs.case_ids }}
          RUN_TOKEN: ${{ inputs.qc_link_run_token }}
          SECRET: ${{ secrets.QC_LINK_SIGNING_SECRET }}
          URL: ${{ vars.QC_LINK_RESULTS_URL }}
          FAIL_IDS: ${{ vars.QC_LINK_WALK_FAIL_IDS }}
          EXTRA_IDS: ${{ vars.QC_LINK_WALK_EXTRA_IDS }}
          PROBES: ${{ vars.QC_LINK_WALK_PROBES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          [ "${PROBES:-}" = 1 ] || echo "::add-mask::$RUN_TOKEN"
          [ -n "$SECRET" ] || { echo "QC_LINK_SIGNING_SECRET is empty"; exit 1; }
          [ -n "$URL" ] || { echo "QC_LINK_RESULTS_URL is empty"; exit 1; }
          ALL="$CASE_IDS${EXTRA_IDS:+,$EXTRA_IDS}"
          BODY=$(jq -S -c -n --arg runId "$RUN_ID" --arg repo "$REPO" --arg runUrl "$RUN_URL" \
            --arg ids "$ALL" --arg fails ",${FAIL_IDS:-}," '
            {runId:$runId, repository:$repo, runUrl:$runUrl,
             results:[ $ids | split(",") | .[] | select(length>0) | . as $id
               | if ($fails | contains("," + $id + ","))
                 then {caseId:$id, outcome:"fail", durationMs:2222, errorDetail:"walk: forced failure"}
                 else {caseId:$id, outcome:"pass", durationMs:1111} end ]}')
          sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //'; }
          post() { # $1 body  $2 token  $3 signature -> prints HTTP status, response body to /tmp/resp
            curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$URL" -H 'Content-Type: application/json' \
              -H "x-qc-link-run-token: $2" -H "x-qc-link-signature: $3" --data-binary "$1"
          }
          SIG="sha256=$(sign "$BODY")"
          # QC-Link records the run id just after the dispatch call returns; the first POST can win that race (401).
          for i in 1 2 3 4 5 6; do
            S=$(post "$BODY" "$RUN_TOKEN" "$SIG"); echo "post attempt $i -> HTTP $S: $(cat /tmp/resp | head -c 400)"
            [ "$S" = 401 ] && { sleep 4; continue; }; break
          done
          [ "$S" = 200 ] || { echo "results were not accepted"; exit 1; }
          if [ "${PROBES:-}" = 1 ]; then
            echo "probe replay (same payload)        -> HTTP $(post "$BODY" "$RUN_TOKEN" "$SIG"): $(head -c 300 /tmp/resp)"
            echo "probe bad signature                -> HTTP $(post "$BODY" "$RUN_TOKEN" "sha256=$(printf %064d 0)"): $(head -c 200 /tmp/resp)"
            ALT=$(printf '%s' "$BODY" | jq -S -c '.results[0].outcome="pass" | .results[0].durationMs=9')
            echo "probe altered body, old signature  -> HTTP $(post "$ALT" "$RUN_TOKEN" "$SIG"): $(head -c 200 /tmp/resp)"
            echo "probe unknown token                -> HTTP $(post "$BODY" "$(printf %064d 7)" "$SIG"): $(head -c 200 /tmp/resp)"
            echo "probe unsigned                     -> HTTP $(post "$BODY" "$RUN_TOKEN" ""): $(head -c 200 /tmp/resp)"
            # Walk-only: expose the single-use token so the walker can replay it AFTER QC-Link settles the run
            # (the reuse-after-settlement probe). It is dead by then. Printed only when PROBES=1.
            echo "WALK_REPLAY_TOKEN=$RUN_TOKEN"; echo "WALK_REPLAY_SIG=$SIG"
          fi
